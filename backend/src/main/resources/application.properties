# ---------- Server ----------
server.port=8080

# ---------- Database (SQLite file created next to where you run the app) ----------
spring.datasource.url=jdbc:sqlite:speaksafe.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

# ---------- SpeakSafe settings ----------
# Which model scores messages: naive-bayes or svm
speaksafe.model=svm
# Score (0-100) at which the user is warned
speaksafe.warn-threshold=50
# Score (0-100) at which a message is blurred and flagged
speaksafe.blur-threshold=70
